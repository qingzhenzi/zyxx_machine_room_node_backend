[package]
name = "qe-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "QEStudio Redis 适配器：刷新令牌、RBAC 权限缓存"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
qe-auth = { path = "../auth" }
redis = { version = "1.5", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

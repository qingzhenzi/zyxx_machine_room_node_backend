[package]
name = "qe-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "QEStudio 认证原语：密码哈希、JWT、刷新令牌会话、权限判定"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.6"
chrono = "0.4"
hex = "0.4"
jsonwebtoken = "11"
# `password_hash::rand_core::OsRng` 需要 rand_core 的 `getrandom` feature。
# argon2 只以 default-features=false 引入 rand_core，单独构建本 crate 时会缺 feature，
# 因此在 workspace 统一构建才能编译。这里显式开启，保证 `cargo check -p qe-auth` 也成立。
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

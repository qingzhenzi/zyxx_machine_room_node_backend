[package]
name = "qe-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "QEStudio 领域模型、RBAC 权限点与输入校验"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
qe-auth = { path = "../auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"

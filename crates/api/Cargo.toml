[package]
name = "qe-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "QEStudio HTTP API：Axum 路由、认证 extractor、配置与启动装配"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
qe-auth = { path = "../auth" }
qe-cache = { path = "../cache" }
qe-db = { path = "../db" }
qe-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "time",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "limit",
    "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

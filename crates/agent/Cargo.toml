[package]
name = "qe-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QEStudio 统一机器 agent 客户端：device-pki mTLS 注册、镜像导入、机器遥测"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
qe-device-pki-client = { path = "../device-pki-client" }
qe-node-agent = { path = "../node-agent" }
qe-room-agent = { path = "../room-agent" }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

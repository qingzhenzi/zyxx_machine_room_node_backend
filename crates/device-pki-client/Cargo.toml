[package]
name = "qe-device-pki-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "设备 PKI 客户端：注册 CLI、TOFU/pin 信任、mTLS 防抖通讯"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"
time = "0.3"
base64 = "0.22"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
sled = "0.34"
webpki-roots = "0.26"
x509-parser = "0.16"
dialoguer = "0.11"
rand = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
qe-device-pki = { path = "../device-pki" }
rcgen = "0.13"
time = "0.3"
base64 = "0.22"

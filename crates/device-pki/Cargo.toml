[package]
name = "qe-device-pki"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "设备 PKI：一次性 token 注册、证书签发/吊销、mTLS 防抖会话"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.16"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
anyhow = "1"
base64 = "0.22"
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"

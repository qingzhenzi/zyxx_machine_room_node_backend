# 本地邮件测试：Mailpit。
#
#   docker compose -f compose.yaml -f compose.mail.yaml up -d mailpit
#   EMAIL_DRIVER=smtp SMTP_URL=smtp://127.0.0.1:1025 cargo run -p qe-api
#
# Web UI: http://127.0.0.1:8025
name: qestudio

services:
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - backend

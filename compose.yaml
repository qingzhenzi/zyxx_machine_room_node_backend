name: qestudio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  BIND_ADDR: 0.0.0.0:8080
  DATABASE_URL: postgres://${POSTGRES_USER:-qestudio}:${POSTGRES_PASSWORD:-qestudio}@postgres:5432/${POSTGRES_DB:-qestudio}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET（openssl rand -hex 32）}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
  DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
  LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
  LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-60}
  LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-300}
  EMAIL_RATE_LIMIT_MAX: ${EMAIL_RATE_LIMIT_MAX:-5}
  EMAIL_RATE_LIMIT_WINDOW_SECONDS: ${EMAIL_RATE_LIMIT_WINDOW_SECONDS:-900}
  ANNOUNCEMENT_CACHE_SECONDS: ${ANNOUNCEMENT_CACHE_SECONDS:-30}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
  PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
  EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-log}
  SMTP_URL: ${SMTP_URL:-smtp://127.0.0.1:1025}
  SMTP_FROM: ${SMTP_FROM:-QEStudio <no-reply@qestudio.local>}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  RUN_MIGRATIONS: "true"
  # 工单附件代理上传需要 20MiB + 余量；必须与 nginx client_max_body_size（25m）对齐。
  # 注意：api 默认值只有 2MiB（config.rs），不在这里显式传就会让 >2MiB 附件 413。
  MAX_BODY_BYTES: ${MAX_BODY_BYTES:-26214400}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
  BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
  # 容器日志统一 JSON，便于 Loki/ELK 采集；本地 cargo run 由 .env 控制。
  LOG_FORMAT: json
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
  # 留空则只写 stdout；设置后启用 OTLP/HTTP trace 导出。
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-qestudio-backend}
  OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}
  # ---- 对象存储（S3 兼容；留空则资源/镜像接口返回 503）----
  # 容器内访问 RustFS 用服务名（本地 cargo run 时 .env 里用 127.0.0.1）；未设置则禁用存储模块。
  S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
  STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-900}
  STORAGE_SIGNING_KEY_BASE64: ${STORAGE_SIGNING_KEY_BASE64:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qestudio}
      POSTGRES_USER: ${POSTGRES_USER:-qestudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qestudio}
    volumes:
      # PostgreSQL 18 官方镜像的 PGDATA 在 /var/lib/postgresql/18/docker，
      # 因此挂载父目录；17 及更早版本应改为 /var/lib/postgresql/data。
      - pgdata:/var/lib/postgresql
    ports:
      # 仅绑定本机，方便 sqlx-cli / psql 调试；生产用 compose.prod.yaml 覆盖掉。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.97-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
        # 内网/受限网络可指定 crates.io 镜像（如 sparse+https://rsproxy.cn/index/）。
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-}
    image: ${BACKEND_IMAGE:-qestudio/backend:local}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend

  # 可选：设备注册 / mTLS 通讯服务（qe-device-pki）。默认不启动，profile=pki 手动开启。
  # 1) 生成开发证书：bash scripts/dev-pki-certs.sh（写到 deploy/device-pki/certs/，勿提交）
  # 2) 启动：docker compose --profile pki up -d --build device-pki
  # 复用 api 构建镜像（单镜像内含 qe-api + qe-device-pki 两个二进制，entrypoint 覆盖）。
  # 设备注册与 mTLS 遥测依赖它；不启用时其余功能不受影响。
  device-pki:
    image: ${BACKEND_IMAGE:-qestudio/backend:local}
    entrypoint: ["/usr/local/bin/qe-device-pki"]
    profiles: ["pki"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qestudio}:${POSTGRES_PASSWORD:-qestudio}@postgres:5432/${POSTGRES_DB:-qestudio}
      ENROLL_ADDR: 0.0.0.0:4440
      MTLS_ADDR: 0.0.0.0:4441
      ENROLL_TLS_CERT: /certs/enroll.pem
      ENROLL_TLS_KEY: /certs/enroll-key.pem
      MTLS_TLS_CERT: /certs/mtls.pem
      MTLS_TLS_KEY: /certs/mtls-key.pem
      CA_KEY: /certs/ca-key.pem
      CA_CERT: /certs/ca.pem
      # 管理端静态 Bearer token（/admin/*）：生产必须换强随机值；profile 未启用时不会被使用。
      ADMIN_TOKEN: ${DEVICE_PKI_ADMIN_TOKEN:-dev-admin-token-change-me}
      ADMIN_RATE_LIMIT: ${DEVICE_PKI_ADMIN_RATE_LIMIT:-30}
      PUBLIC_ENROLL_ENDPOINT: ${PUBLIC_ENROLL_ENDPOINT:-https://localhost:4440}
      PUBLIC_MTLS_ENDPOINT: ${PUBLIC_MTLS_ENDPOINT:-https://localhost:4441}
      # 资源/镜像预签名与 qe-api 必须用同一套 S3 + 签名密钥，否则 manifest 验签失败。
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      STORAGE_SIGNING_KEY_BASE64: ${STORAGE_SIGNING_KEY_BASE64:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # 开发自签证书（gen_test_ca 生成），只读挂载。
      - ./deploy/device-pki/certs:/certs:ro
    ports:
      - "127.0.0.1:${DEVICE_PKI_ENROLL_PORT:-4440}:4440"
      - "127.0.0.1:${DEVICE_PKI_MTLS_PORT:-4441}:4441"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 注册 listener 是单向 TLS，-k 跳过开发自签证书校验。
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:4440/crl"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31-alpine}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend


  # 可选：管理控制台（frontend/ 的 Vite 构建 + nginx）。
  # 启动：docker compose --profile console up -d console
  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: ${CONSOLE_IMAGE:-qestudio/console:local}
    profiles: ["console"]
    ports:
      - "${CONSOLE_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  # 可选：S3 兼容对象存储（资源/镜像 P0）。`docker compose --profile storage up -d rustfs`
  # 控制台默认 9001；把 S3_ENDPOINT 指向 http://rustfs:9000、S3_BUCKET=qestudio 即可启用。
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    profiles: ["storage"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfsdata:/data
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  rustfsdata:
  pgdata:
  redisdata:

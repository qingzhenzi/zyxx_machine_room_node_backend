[workspace]
members = ["crates/auth"]
resolver = "3"

[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "QEStudio backend: Axum + PostgreSQL + Redis with RBAC and announcements"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
qe-auth = { path = "crates/auth" }
redis = { version = "1.5", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "time",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "limit",
    "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

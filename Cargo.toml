[workspace]
members = ["crates/api", "crates/auth", "crates/cache", "crates/db", "crates/domain", "crates/storage", "crates/device-pki"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/QEStudio/backend-template"
authors = ["QEStudio"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# 磁盘优化（2026-11-07）：本机 target 曾达 128G（debug/incremental 单项 53G）。
# dev/test 只保留行表级调试信息并关闭增量编译；需要完整调试时临时
# `CARGO_PROFILE_DEV_DEBUG=2 cargo ...`。发布构建见上方 [profile.release]。
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

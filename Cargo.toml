[workspace]
members = ["crates/api", "crates/auth", "crates/cache", "crates/db", "crates/domain", "crates/storage", "crates/node-agent", "crates/device-pki", "crates/device-pki-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/QEStudio/backend-template"
authors = ["QEStudio"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

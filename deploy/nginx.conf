user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time rid=$request_id trace=$sent_http_x_trace_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Docker 内置 DNS。valid=5s 让 nginx 感知 compose 扩缩容后的副本 IP。
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backend_api {
        zone backend_api 64k;
        least_conn;
        server api:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # 默认只对幂等请求做重试；POST 不会被 nginx 自动重放。
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        location = /healthz {
            access_log off;
            proxy_pass http://backend_api;
        }

        location = /readyz {
            access_log off;
            proxy_pass http://backend_api;
        }

        location / {
            proxy_pass http://backend_api;
        }
    }
}
